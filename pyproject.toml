[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-audio-cli"
version = "0.1.0"
description = "A small CLI tool for extracting audio from YouTube video URLs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Charles DeFreese" }
]
keywords = [
  "youtube",
  "audio",
  "cli",
  "yt-dlp",
  "ffmpeg",
  "registers"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities"
]

dependencies = [
  "yt-dlp>=2024.1.1",
  "registers",
  "rich>=13.7.0",
  "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "build>=1.2.0",
  "twine>=5.0.0"
]

[project.scripts]
yt-audio = "yt_audio:main"

[tool.setuptools]
py-modules = ["yt_audio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true